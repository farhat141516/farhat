<!doctype html>
<html lang="ru">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Подать заявку — Аль Бушра</title><link rel="stylesheet" href="/styles.css" /></head>
<body>
<header class="page-header"><nav class="nav container" aria-label="Основная навигация"><a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">أ</span><span>Аль Бушра<small>медресе</small></span></a><div class="page-nav"><a href="about.html">О медресе</a><a href="teachers.html">Устазы</a></div></nav></header>
<main class="inner-page container"><p class="eyebrow">Приём заявок</p><h1>Начните путь в Аль Бушра</h1><p class="lead">Заполните форму, и мы свяжемся с вами.</p><form class="application-form standalone-form" id="application-form" novalidate><div class="honeypot" aria-hidden="true"><label for="website">Не заполняйте это поле</label><input id="website" name="website" type="text" tabindex="-1" autocomplete="off" /></div><div class="form-grid"><div class="field full-width"><label for="student-name">ФИО ученика *</label><input id="student-name" name="studentName" required aria-describedby="student-name-error" /><p class="field-error" id="student-name-error"></p></div><div class="field"><label for="birth-date">Дата рождения *</label><input id="birth-date" name="birthDate" placeholder="ГГГГ-ММ-ДД" required aria-describedby="birth-date-error" /><p class="field-error" id="birth-date-error"></p></div><div class="field"><label for="guardian-name">Имя родителя / опекуна *</label><input id="guardian-name" name="guardianName" required aria-describedby="guardian-name-error" /><p class="field-error" id="guardian-name-error"></p></div><div class="field"><label for="phone">Телефон *</label><input id="phone" name="phone" type="tel" required aria-describedby="phone-error" /><p class="field-error" id="phone-error"></p></div><div class="field"><label for="program">Программа *</label><select id="program" name="program" required aria-describedby="program-error"><option value="">Выберите программу</option><option>Начальный уровень</option><option>Основная программа</option><option>Изучение Корана</option><option>Арабский язык</option></select><p class="field-error" id="program-error"></p></div><div class="field full-width"><label for="comment">Комментарий</label><textarea id="comment" name="comment" rows="3"></textarea></div></div><div class="consent field"><input id="consent" name="consent" type="checkbox" required aria-describedby="consent-error" /><label for="consent">Я согласен(на) на обработку персональных данных. *</label></div><p class="field-error" id="consent-error"></p><p class="form-status" id="form-status" role="status" aria-live="polite"></p><button class="button submit-button" type="submit">Отправить заявку <span aria-hidden="true">→</span></button></form></main><script src="/app.js"></script>
</body></html>
